name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  # CI has no GPU: the scheduler must fall back to its simulated fleet, and the
  # tests assert on that path rather than skipping.
  KUBEAI_SIMULATED_GPUS: "nvidia-rtx4090:4"

jobs:
  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"

      - name: Lint
        run: ruff check src tests benchmarks

      - name: Test
        run: pytest -q --junitxml=junit-${{ matrix.os }}-${{ matrix.python-version }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-${{ matrix.python-version }}
          path: junit-*.xml
          if-no-files-found: ignore

  smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[web]"

      # The self-test DAG exercises discovery, scheduling, serving and the
      # workflow engine in one run; if this passes the platform works end to end.
      - name: Run the self-test workflow
        run: kubeai workflow run examples/selftest-pipeline.yaml --show-output --json > selftest.json

      - name: Validate the example workflows
        run: |
          kubeai workflow validate examples/selftest-pipeline.yaml
          kubeai workflow validate examples/training-pipeline.yaml

      - name: Compile the training pipeline to Argo
        run: kubeai workflow compile examples/training-pipeline.yaml --format argo --out argo.yaml

      - name: Compile the training pipeline to a cluster bundle
        run: kubeai workflow compile examples/training-pipeline.yaml --format k8s --out cluster.yaml

      - name: Verify --json emits valid JSON with no tables mixed in
        run: |
          kubeai gpus --json | python -c "import json,sys; d=json.load(sys.stdin); print('gpus json ok:', d['source'])"
          kubeai bench workflow --requests 6 --seconds-per-step 0.01 --json \
            | python -c "import json,sys; d=json.load(sys.stdin); print('bench json ok:', len(d['scenarios']), 'scenarios')"
          kubeai schedule --requests 12 --json \
            | python -c "import json,sys; d=json.load(sys.stdin); print('schedule json ok:', len(d), 'policies')"

      - name: Short benchmark (guards against a regression that breaks batching)
        run: |
          kubeai bench serving --requests 48 --max-tokens 48 --batch-sizes 1,32 \
            --model-dim 256 --model-layers 4 --json > bench.json
          python - <<'PY'
          import json, sys

          report = json.load(open("bench.json"))
          scenarios = report["scenarios"]
          serial = next(s for s in scenarios if s["batch_size"] == 1 and "serial" in s["label"])
          continuous = {s["batch_size"]: s for s in scenarios if "continuous" in s["label"]}
          static = {s["batch_size"]: s for s in scenarios if "static" in s["label"]}

          big = max(continuous)
          cont, stat = continuous[big], static[big]
          print(f"serial                  {serial['throughput_tokens_per_second']:8.1f} tok/s")
          print(f"static     batch={big:<3}   {stat['throughput_tokens_per_second']:8.1f} tok/s "
                f"(slot eff {stat['slot_efficiency']:.3f})")
          print(f"continuous batch={big:<3}   {cont['throughput_tokens_per_second']:8.1f} tok/s "
                f"(slot eff {cont['slot_efficiency']:.3f})")
          print(f"continuous vs serial    {cont['speedup_vs_serial']:8.2f}x  (reported, not asserted)")
          print(f"continuous vs static    "
                f"{cont['throughput_tokens_per_second'] / stat['throughput_tokens_per_second']:8.2f}x")

          # These are *structural* claims, true on any machine: rebuilding the batch
          # every step (a) is faster than decode-until-all-finish at the same batch
          # size, and (b) never spends a slot on a sequence that already finished.
          # The throughput ratio against serial is deliberately only reported —
          # it depends on how long the generations are, so asserting it here would
          # make the build flaky rather than meaningful.
          failures = []
          if cont["throughput_tokens_per_second"] <= stat["throughput_tokens_per_second"]:
              failures.append("continuous batching did not beat static batching")
          if cont["slot_efficiency"] < 0.95:
              failures.append(
                  f"continuous slot efficiency collapsed to {cont['slot_efficiency']:.3f}"
              )
          if stat["slot_efficiency"] > 0.95:
              failures.append(
                  "static batching looks as efficient as continuous — the static "
                  "baseline is probably admitting work mid-group again"
              )
          if failures:
              sys.exit("; ".join(failures))
          print("batching behaviour intact")
          PY

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: kubeai-artefacts
          path: |
            selftest.json
            argo.yaml
            cluster.yaml
            bench.json

  docker:
    name: container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: kubeai-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name kubeai -p 8080:8080 kubeai-platform:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS -X POST http://127.0.0.1:8080/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"ping"}],"max_tokens":2}' | tee response.json
          python -c "import json;d=json.load(open('response.json'));assert d['choices'][0]['message']['content'] is not None"
          docker logs kubeai | tail -20

  helm:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint
        run: helm lint deploy/helm/kubeai
      - name: Template
        run: |
          helm template kubeai deploy/helm/kubeai \
            --set serviceMonitor.enabled=true \
            --set prometheusRule.enabled=true \
            --set autoscaling.enabled=true > /tmp/rendered.yaml
          python -c "
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/rendered.yaml')) if d]
          kinds = sorted({d['kind'] for d in docs})
          print('rendered kinds:', kinds)
          assert 'Deployment' in kinds and 'Service' in kinds and 'ConfigMap' in kinds
          "
