apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeai.fullname" . }}-models
  labels:
    {{- include "kubeai.labels" . | nindent 4 }}
data:
  # Kept as YAML rather than flags so the registry can grow without rewriting the
  # Deployment args, and so a config change is a visible, reviewable diff.
  models.yaml: |
    {{- include "kubeai.modelsConfig" . | nindent 4 }}
