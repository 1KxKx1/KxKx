[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubeai-platform"
version = "0.4.0"
description = "Cloud-native AI platform: GPU-aware scheduler, DAG workflow engine and an OpenAI-compatible batched inference gateway."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Zhang Kaixiang" }]
keywords = ["kubernetes", "gpu-scheduling", "llm-serving", "continuous-batching", "argo-workflow", "cloud-native", "ai-infra"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]

# Core install is deliberately tiny: the scheduler, workflow engine and batching
# serving path need nothing beyond these two. The HTTP layer and real tensor
# backends are extras, so a benchmarking or CI environment does not have to pull
# a web framework (or torch) to run.
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
]
torch = ["torch>=2.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    # The gateway suite is part of "run the tests", so dev implies web.
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
]

[project.scripts]
kubeai = "kubeai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
